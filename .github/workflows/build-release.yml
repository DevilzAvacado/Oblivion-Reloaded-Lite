name: Build Oblivion Reloaded Lite

on:
  push:
    branches:
      - master
      - "release/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-oblivion-x86:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $releaseTag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
          } elseif ("${{ github.ref_name }}".StartsWith("release/")) {
            $releaseTag = "v" + "${{ github.ref_name }}".Substring(8)
          }

          if ($releaseTag) {
            if (!$releaseTag.StartsWith("v")) { throw "Release tags must start with v." }
            $version = $releaseTag.Substring(1)
          } else {
            $version = "dev-${{ github.sha }}".Substring(0, 11)
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "package_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore NuGet packages
        run: nuget restore TESReloaded.sln -NonInteractive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: i686-pc-windows-msvc

      - name: Build 32-bit Configurator library
        shell: pwsh
        run: |
          cargo build --manifest-path Configurator/Cargo.toml --release --target i686-pc-windows-msvc
          New-Item -ItemType Directory -Force Configurator/target/release | Out-Null
          Copy-Item Configurator/target/i686-pc-windows-msvc/release/Configurator.dll.lib Configurator/target/release/Configurator.dll.lib -Force

      - name: Build Oblivion Reloaded x86 plugin
        shell: cmd
        run: msbuild TESReloaded.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Stage installable plugin
        shell: cmd
        run: build.bat OblivionReloaded

      - name: Package plugin
        shell: pwsh
        run: |
          if (!(Test-Path "build/OblivionReloaded/obse/Plugins/OblivionReloaded.dll")) { throw "Expected xOBSE plugin DLL was not produced." }
          Compress-Archive -Path "build/OblivionReloaded/*" -DestinationPath "Oblivion-Reloaded-Lite-$env:PACKAGE_VERSION.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-Reloaded-Lite-${{ steps.version.outputs.package_version }}
          path: Oblivion-Reloaded-Lite-${{ steps.version.outputs.package_version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for version tags or release branches
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          name: Oblivion Reloaded Lite ${{ steps.version.outputs.release_tag }} (Unofficial)
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Unofficial Steam Deck-oriented source fork of TESReloaded10.

            See the repository README, changelog, installation guide and testing notes for the exact features and validation status of this tagged build.
          files: Oblivion-Reloaded-Lite-${{ steps.version.outputs.package_version }}.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.release_tag, '-') }}
